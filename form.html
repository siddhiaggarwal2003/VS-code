  <!DOCTYPE html>
<html>
<head>
    <title>Sign Up Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .form {
            width: 550px;
            margin: 50px auto;
        }

        h2 {
            text-align: center;
        }

        .row {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .row label {
            width: 140px;
        }

        input, select {
            width: 300px;
            padding: 8px;
            box-sizing: border-box;
        }

        /* Description */
        .description-row {
            display: flex;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .description-row label {
            width: 140px;
            padding-top: 8px;
        }

        textarea {
            width: 300px;
            height: 100px;
            padding: 8px;
            box-sizing: border-box;
            resize: none;
        }

        /* Rating */
        .rating {
            display: flex;
            flex-direction: row;
            gap: 5px;
        }

        .rating input {
            display: none;
        }

        .rating label {
            width: auto;
            font-size: 28px;
            color: lightgray;
            cursor: pointer;
        }

        .rating label.active {
            color: gold;
        }

        /* Buttons */
        .buttons {
            text-align: center;
            margin-top: 20px;
        }

        button {
            padding: 10px 25px;
            margin: 5px;
            cursor: pointer;
        }
    </style>

    <script>
        function rate(value) {

            let stars = document.querySelectorAll(".star");

            for (let i = 0; i < stars.length; i++) {

                if (i < value) {
                    stars[i].classList.add("active");
                } else {
                    stars[i].classList.remove("active");
                }

            }
        }

        function signUp() {
            alert("Sign Up successful!");
        }

        function submitForm() {
            alert("Form submitted successfully!");
        }
    </script>

</head>

<body>

<div class="form">

    <h2>Sign Up Form</h2>

    <form>

        <!-- Name -->
        <div class="row">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">
        </div>

        <!-- Email -->
        <div class="row">
            <label for="email">Email ID:</label>
            <input type="email" id="email" name="email">
        </div>

        <!-- Mobile Number -->
        <div class="row">
            <label for="mobile">Mobile No.:</label>
            <input type="tel" id="mobile" name="mobile">
        </div>

        <!-- Gender -->
        <div class="row">
            <label for="gender">Gender:</label>

            <select id="gender" name="gender">
                <option value="">Select</option>
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select>
        </div>

        <!-- Date of Birth -->
        <div class="row">
            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob">
        </div>

        <!-- Rating -->
        <div class="row">
            <label>Rating:</label>

            <div class="rating">

                <input type="radio" name="rating" value="1">
                <label class="star" onclick="rate(1)">★</label>

                <input type="radio" name="rating" value="2">
                <label class="star" onclick="rate(2)">★</label>

                <input type="radio" name="rating" value="3">
                <label class="star" onclick="rate(3)">★</label>

                <input type="radio" name="rating" value="4">
                <label class="star" onclick="rate(4)">★</label>

                <input type="radio" name="rating" value="5">
                <label class="star" onclick="rate(5)">★</label>

            </div>
        </div>

        <!-- Description -->
        <div class="description-row">

            <label for="description">Description:</label>

            <textarea id="description" name="description"
                placeholder="Write your review here..."></textarea>

        </div>

        <!-- Buttons -->
        <div class="buttons">

            <button type="button" onclick="signUp()">
                Sign Up
            </button>

            <button type="button" onclick="submitForm()">
                Submit
            </button>

        </div>

    </form>

</div>

</body>
</html>
