<!DOCTYPE html>
<html>
<head>
    <title>HTML Tables</title>

    <style>
        table {
            border-collapse: collapse;
            width: 600px;
            margin-bottom: 40px;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: white;
        }

        .product-table td,
        .product-table th {
            text-align: left;
        }
    </style>
</head>

<body>

    <!-- TABLE 1: Merged Cells -->

    <h2>A test table with merged cells</h2>

    <table>
        <tr>
            <th rowspan="2"></th>
            <th colspan="2">Average</th>
            <th rowspan="2">Red eyes</th>
        </tr>

        <tr>
            <th>height</th>
            <th>weight</th>
        </tr>

        <tr>
            <th>Males</th>
            <td>1.9</td>
            <td>0.003</td>
            <td>40%</td>
        </tr>

        <tr>
            <th>Females</th>
            <td>1.7</td>
            <td>0.002</td>
            <td>43%</td>
        </tr>
    </table>


    <!-- TABLE 2: Product Table -->

    <h1>HTML Tables</h1>

    <table class="product-table">
        <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Price</th>
        </tr>

        <tr>
            <td>Laptop</td>
            <td>Electronics</td>
            <td>$800</td>
        </tr>

        <tr>
            <td>Bookshelf</td>
            <td>Furniture</td>
            <td>$150</td>
        </tr>

        <tr>
            <td>Coffee Maker</td>
            <td>Appliances</td>
            <td>$50</td>
        </tr>
    </table>

</body>
</html>
