<!DOCTYPE html>
<html>
<head>
    <title>Div Example</title>
</head>
<body>

    <div style="color: yellow; background-color: red; 
                width: 300px; height: 150px; 
                font-size: 24px;
                font-family: fantasy;">
        Hello! This is a div.
    </div>
    <br>
    <title>Div with Color and Size</title>

    <style>
        #myDiv {
            background-color: lightblue;
            outline: 5px solid darkblue;
            width: 300px;
            height: 150px;
            font-size: 20px;
            padding: 20px;
        }
    </style>
</head>

<body>

    <div id="myDiv">
        Hello World!
        <p>This is a div with color and size.</p>
    </div>

</body>
</html>
