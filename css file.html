<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Revised Headings Page</title>
  <style>
    /* ID Selectors for button and paragraph */
    #sel { 
      color: blueviolet; 
    }
    #sel2 { 
      background-color: brown; 
    }
    button:hover{
        color: greenyellow;
    } 
    .heading h1, .heading h2, .heading h3 { 
      font-size: 0.8rem; 
    }
    .headings h4, .headings h5, .headings h6 { 
      font-size: 2.2rem; 
    }
  </style>
</head>
<body>

  <button>submit</button>
  <p id="sel2">hello everyone</p>

  <div class="heading">
    <h1>Hello World </h1>
    <h2>Hello World </h2>
    <h3>Hello World </h3>
  </div>

  <div class="headings"> 
    <h4>Hello World </h4>
    <h5>Hello World </h5>
    <h6>Hello World </h6>
  </div>

</body>
</html>
